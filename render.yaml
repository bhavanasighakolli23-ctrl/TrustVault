services:
  - type: web
    name: trustvault
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/trustvault.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
    disk:
      name: trustvault-data
      mountPath: /var/data
      sizeGB: 1
