<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Error {{ code }} | TrustVault</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="{{ url_for('index') }}">TrustVault</a><p class="eyebrow">ERROR {{ code }}</p><h1>Something went wrong</h1><p class="muted">{{ message }}</p><a class="button primary full" href="{{ url_for('dashboard') if session.get('user_id') else url_for('index') }}">Continue</a></main></body></html>
